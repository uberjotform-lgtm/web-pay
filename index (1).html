<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16203A; --muted:#5B6584;
  --line:#D5DBE7; --accent:#2F4BD8; --accent-ink:#FFFFFF; --band:#16203A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1526; --surface:#18203A; --ink:#E8ECF7; --muted:#9AA4C2;
    --line:#2A3556; --accent:#7D93FF; --accent-ink:#0F1526; --band:#0A0F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1526; --surface:#18203A; --ink:#E8ECF7; --muted:#9AA4C2;
  --line:#2A3556; --accent:#7D93FF; --accent-ink:#0F1526; --band:#0A0F1D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0}
a{color:inherit}
.band{background:var(--band);height:180px;position:relative;overflow:hidden}
.band span{position:absolute;right:-2vw;bottom:-0.25em;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:clamp(5rem,16vw,13rem);color:rgba(255,255,255,.06);line-height:1;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:320px 1fr;gap:48px}
.side{margin-top:-72px}
.avatar{width:144px;height:144px;border-radius:50%;border:5px solid var(--bg);background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:3rem;position:relative}
.side h1{font-size:2rem;line-height:1.15;margin:20px 0 4px}
.role{color:var(--muted);margin:0 0 20px}
.status{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid var(--accent);
  color:var(--accent);font-size:.875rem;font-weight:600;margin-bottom:20px}
.facts{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.facts li{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:.95rem}
.facts b{color:var(--muted);font-weight:500}
.facts a{text-decoration:none;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cta{display:block;width:100%;text-align:center;background:var(--accent);color:var(--accent-ink);
  padding:14px;border-radius:12px;font-weight:600;text-decoration:none}
.cta:focus-visible,.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.main{padding:28px 0 64px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 0;font:inherit;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.panel{padding-top:28px}
.panel[hidden]{display:none}
.bio{max-width:62ch;font-size:1.05rem;margin:0 0 32px}
h2{font-size:1.35rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{aspect-ratio:16/10;display:flex;align-items:flex-end;padding:16px;color:#fff;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.6rem;line-height:1.1}
.svc .body{padding:16px 18px 20px}
.svc h3{font-size:1.1rem;margin-bottom:6px}
.price{color:var(--accent);font-weight:600}
.svc p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.work .thumb{border-radius:14px;aspect-ratio:4/3}
.work small{display:block;margin-top:8px;color:var(--muted)}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:0}
  .band{height:140px}
  .side{margin-top:-64px}
}
</style>
</head>
<body>
<div class="band" aria-hidden="true"><span id="bandText"></span></div>
<div class="wrap">
  <aside class="side">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <div class="status" id="status"></div>
    <ul class="facts" id="facts"></ul>
    <a class="cta" id="cta">Send an email</a>
  </aside>
  <main class="main">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="work">Work</button>
      <button role="tab" aria-selected="false" data-tab="services">Services</button>
      <button role="tab" aria-selected="false" data-tab="about">About</button>
    </div>
    <section class="panel" id="work">
      <div class="grid work" id="workGrid"></div>
    </section>
    <section class="panel" id="services" hidden>
      <h2>Services</h2>
      <div class="grid" id="svcGrid"></div>
    </section>
    <section class="panel" id="about" hidden>
      <p class="bio" id="bio"></p>
    </section>
  </main>
</div>

<script>
/* ===== عدّل البيانات دي لكل موظف ===== */
const PROFILE = {
  name: "Benny Wijaya",
  role: "Product & Brand Designer",
  status: "Available for freelance and full-time",
  email: "pa8yon108@outlook.sa",
  phone: "+62 88809360420",
  location: "Tangerang, Indonesia",
  website: "",
  bio: "Short paragraph about the employee: what they design, who they've worked with, and how they like to work.",
  services: [
    { title: "Brand identity design", price: "From US$500", note: "Logo, colour system, type and brand guide.", colors: ["#1F3BB3","#0E1A55"] },
    { title: "Mobile app UI & UX", price: "From US$5,000", note: "Flows, wireframes and high-fidelity screens.", colors: ["#6A2BD9","#2A0F66"] },
    { title: "Landing page design", price: "From US$800", note: "One responsive page, ready for development.", colors: ["#0F7A6B","#073A33"] }
  ],
  work: [
    { title: "Fintech wallet app", tag: "UI/UX", colors: ["#6A2BD9","#2A0F66"] },
    { title: "Coffee brand refresh", tag: "Branding", colors: ["#8A4B1F","#3B1E0A"] },
    { title: "Design system v2", tag: "Product design", colors: ["#1F3BB3","#0E1A55"] },
    { title: "Travel booking site", tag: "Web", colors: ["#0F7A6B","#073A33"] }
  ]
};
/* ===================================== */

const $ = id => document.getElementById(id);
const initials = PROFILE.name.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
document.title = PROFILE.name + " – Portfolio";
$("avatar").textContent = initials;
$("bandText").textContent = PROFILE.name;
$("name").textContent = PROFILE.name;
$("role").textContent = PROFILE.role;
$("status").textContent = PROFILE.status;
$("bio").textContent = PROFILE.bio;
$("cta").href = "mailto:" + PROFILE.email;

const facts = [
  ["Email", PROFILE.email, "mailto:" + PROFILE.email],
  ["Phone", PROFILE.phone, "tel:" + PROFILE.phone.replace(/\s/g,"")],
  ["Based in", PROFILE.location],
  ["Website", PROFILE.website, PROFILE.website]
].filter(f => f[1]);
$("facts").innerHTML = facts.map(([k,v,href]) =>
  `<li><b>${k}</b>${href ? `<a href="${href}">${v}</a>` : `<span>${v}</span>`}</li>`).join("");

const grad = c => `background:linear-gradient(135deg,${c[0]},${c[1]})`;
$("svcGrid").innerHTML = PROFILE.services.map(s => `
  <article class="svc">
    <div class="thumb" style="${grad(s.colors)}">${s.title}</div>
    <div class="body"><h3>${s.title}</h3><div class="price">${s.price}</div><p>${s.note}</p></div>
  </article>`).join("");
$("workGrid").innerHTML = PROFILE.work.map(w => `
  <article>
    <div class="thumb" style="${grad(w.colors)}">${w.title}</div>
    <small>${w.tag}</small>
  </article>`).join("");

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b === btn));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== btn.dataset.tab);
  });
});
</script>
</body>
</html>
